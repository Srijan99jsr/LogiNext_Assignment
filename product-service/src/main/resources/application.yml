server:
  port: 8081
  shutdown: graceful            # finish in-flight requests when ECS stops a task

spring:
  application:
    name: product-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # DB_HOST = RDS Proxy (or Aurora writer) endpoint. Credentials come from Secrets Manager via ECS.
    url: jdbc:mysql://${DB_HOST}:3306/productdb?createDatabaseIfNotExist=true&sslMode=REQUIRED
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update          # fine for this demo; use Flyway/Liquibase for real schema changes
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      ssl:
        enabled: ${REDIS_SSL:true}   # ElastiCache in-transit encryption
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 5MB

app:
  aws-region: ${AWS_REGION:us-east-1}
  s3-bucket: ${S3_BUCKET}
  cache-ttl-minutes: ${CACHE_TTL_MINUTES:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness is used by the ALB health check
  health:
    redis:
      enabled: false             # a Redis blip must not make the ALB kill healthy tasks

logging:
  pattern:
    console: "%d{ISO8601} %-5level [${spring.application.name}] [%thread] %logger{36} - %msg%n"
