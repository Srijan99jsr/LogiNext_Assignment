server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/orderdb?createDatabaseIfNotExist=true&sslMode=REQUIRED
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

app:
  # ECS Service Connect gives product-service this stable DNS name inside the cluster
  product-service-url: ${PRODUCT_SERVICE_URL:http://product-service:8081}
  cart-service-url: ${CART_SERVICE_URL:http://cart-service:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{ISO8601} %-5level [${spring.application.name}] [%thread] %logger{36} - %msg%n"
