<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annual Sale Store</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1d1f23; }
    header { background: #232f3e; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    main { max-width: 1000px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 12px; }
    button { background: #ff9900; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .muted { color: #6b7280; font-size: 14px; }
    #msg { min-height: 20px; color: #047857; }
  </style>
</head>
<body>
<header><strong>Annual Sale Store</strong><span class="muted" id="who"></span></header>
<main>
  <section><h2>Products</h2><div id="products">Loading…</div></section>
  <aside>
    <h2>Your cart</h2>
    <div class="card"><div id="cart">Empty</div><p><button id="checkout">Place order</button></p><div id="msg"></div></div>
    <h2>Your orders</h2><div id="orders"></div>
  </aside>
</main>
<script>
  // Same-origin calls: CloudFront sends /api/* to the ALB, everything else to the S3 bucket.
  let userId = null;
  try { userId = localStorage.getItem('demoUserId'); } catch (e) {}
  if (!userId) { userId = 'u-' + crypto.randomUUID().slice(0, 8); try { localStorage.setItem('demoUserId', userId); } catch (e) {} }
  document.getElementById('who').textContent = 'User ' + userId;

  const api = async (path, opts = {}) => {
    const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
    if (!r.ok) throw new Error((await r.text()) || r.status);
    return r.status === 204 ? null : r.json();
  };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function loadProducts() {
    const list = await api('/api/products');
    document.getElementById('products').innerHTML = list.length ? list.map(p => `
      <div class="card"><strong>${esc(p.name)}</strong> — ₹${esc(p.price)}
        <div class="muted">${esc(p.description)} · stock ${esc(p.stock)}</div>
        <p><button data-id="${p.id}" data-price="${p.price}">Add to cart</button></p></div>`).join('')
      : '<p class="muted">No products yet. Create some with POST /api/products.</p>';
    document.querySelectorAll('#products button').forEach(b => b.onclick = async () => {
      await api(`/api/cart/${userId}/items`, { method: 'POST',
        body: JSON.stringify({ productId: b.dataset.id, quantity: 1, price: b.dataset.price }) });
      loadCart();
    });
  }

  async function loadCart() {
    const c = await api(`/api/cart/${userId}`);
    document.getElementById('cart').innerHTML = c.items.length
      ? c.items.map(i => `<div>Product #${esc(i.productId)} × ${esc(i.quantity)}</div>`).join('') + `<p><strong>Total ₹${esc(c.total)}</strong></p>`
      : 'Empty';
    window.cartItems = c.items;
  }

  async function loadOrders() {
    const o = await api(`/api/orders/user/${userId}`);
    document.getElementById('orders').innerHTML = o.map(x =>
      `<div class="card">Order #${x.id} · ${esc(x.status)} · ₹${esc(x.totalAmount)}</div>`).join('');
  }

  document.getElementById('checkout').onclick = async () => {
    const msg = document.getElementById('msg');
    if (!window.cartItems?.length) { msg.textContent = 'Cart is empty'; return; }
    try {
      const order = await api('/api/orders', { method: 'POST', body: JSON.stringify({
        userId, items: window.cartItems.map(i => ({ productId: Number(i.productId), quantity: i.quantity })) }) });
      msg.textContent = `Order #${order.id} placed!`;
      loadCart(); loadOrders();
    } catch (e) { msg.textContent = 'Checkout failed: ' + e.message; }
  };

  loadProducts().catch(e => document.getElementById('products').textContent = 'Error: ' + e.message);
  loadCart().catch(() => {});
  loadOrders().catch(() => {});
</script>
</body>
</html>
